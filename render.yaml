services:
  - type: web
    name: manuflow-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: >-
      sh -c 'alembic upgrade head && python -m app.scripts.seed_admin &&
      uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}'
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: manuflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: BUSINESS_TIMEZONE
        value: Asia/Jakarta
      - key: PURCHASING_DEPARTMENT_CODE
        value: PURCHASING
      - key: SALES_DEPARTMENT_CODE
        value: SALES
      - key: WAREHOUSE_DEPARTMENT_CODE
        value: WAREHOUSE
      - key: PRODUCTION_DEPARTMENT_CODE
        value: PRODUCTION
      - key: QUALITY_DEPARTMENT_CODE
        value: QUALITY
      - key: FIRST_ADMIN_EMAIL
        value: admin@example.com
      - key: FIRST_ADMIN_PASSWORD
        sync: false
      - key: FIRST_ADMIN_FIRST_NAME
        value: System
      - key: FIRST_ADMIN_LAST_NAME
        value: Administrator
      - key: CORS_ORIGINS
        value: '["http://localhost:3000","http://localhost:8080"]'

databases:
  - name: manuflow-db
    region: singapore
    plan: free
    postgresMajorVersion: "16"
    databaseName: erp_manufaktur
    user: erp
