services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_manufaktur
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_manufaktur"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://erp:${POSTGRES_PASSWORD}@db:5432/erp_manufaktur
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      BUSINESS_TIMEZONE: Asia/Jakarta
      PURCHASING_DEPARTMENT_CODE: PURCHASING
      SALES_DEPARTMENT_CODE: SALES
      WAREHOUSE_DEPARTMENT_CODE: WAREHOUSE
      PRODUCTION_DEPARTMENT_CODE: PRODUCTION
      QUALITY_DEPARTMENT_CODE: QUALITY
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD}
      FIRST_ADMIN_FIRST_NAME: System
      FIRST_ADMIN_LAST_NAME: Administrator
      CORS_ORIGINS: '["https://erp.103.93.134.27.nip.io"]'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        API_URL: https://api.103.93.134.27.nip.io/api/v1
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  production_postgres_data:
  caddy_data:
  caddy_config:
