services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp_manufaktur
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_manufaktur"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://erp:${POSTGRES_PASSWORD}@db:5432/erp_manufaktur
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured}
      ACCESS_TOKEN_EXPIRE_MINUTES: 480
      BUSINESS_TIMEZONE: Asia/Jakarta
      PURCHASING_DEPARTMENT_CODE: PURCHASING
      SALES_DEPARTMENT_CODE: SALES
      WAREHOUSE_DEPARTMENT_CODE: WAREHOUSE
      PRODUCTION_DEPARTMENT_CODE: PRODUCTION
      QUALITY_DEPARTMENT_CODE: QUALITY
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:?FIRST_ADMIN_EMAIL must be configured}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:?FIRST_ADMIN_PASSWORD must be configured}
      FIRST_ADMIN_FIRST_NAME: ${FIRST_ADMIN_FIRST_NAME:-System}
      FIRST_ADMIN_LAST_NAME: ${FIRST_ADMIN_LAST_NAME:-Administrator}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be configured}
    depends_on:
      db:
        condition: service_healthy
    networks:
      default: {}
      proxy:
        aliases:
          - ${DEPLOY_ENV:?DEPLOY_ENV must be configured}-api

  web:
    build:
      context: ./frontend
      args:
        API_URL: ${API_URL:?API_URL must be configured}
    restart: unless-stopped
    networks:
      default: {}
      proxy:
        aliases:
          - ${DEPLOY_ENV:?DEPLOY_ENV must be configured}-web

networks:
  proxy:
    name: manuflow_proxy
    external: true

volumes:
  database_data:
    name: ${POSTGRES_VOLUME:?POSTGRES_VOLUME must be configured}
